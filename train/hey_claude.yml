# Training settings for the "hey claude" wake word, scaled to run on a
# laptop: about 1 GB of downloads and well under an hour of training.
# See docs/training-hey-claude.md.
#
# Paths are relative to the project root, so run from there.

model_name: "hey_claude"

target_phrase:
  - "hey claude"

# Empty because train/generate_clips.py already made the sound-alike
# negatives ("hey cloud", "hey clyde", ...) itself.
custom_negative_phrases: []

# Must match what you passed to generate_clips.py.
n_samples: 500
n_samples_val: 100

# Only used by the clip-generation stage, which we skip on a Mac.
tts_batch_size: 50
piper_sample_generator_path: "./train/stub"

# Small batches keep memory use sane on a 16 GB laptop.
augmentation_batch_size: 16
augmentation_rounds: 1

output_dir: "./train"

# Real room recordings plus locally generated noise, mixed into the clips
# so the model hears the phrase the way a room delivers it.
rir_paths:
  - "./train/data/mit_rirs"
background_paths:
  - "./train/data/background_clips"
background_paths_duplication_rate:
  - 1

# Pre-computed features for a lot of other audio — this is what teaches the
# model to stay quiet the rest of the time. fetch_data.py downloads a slice
# of the full 17 GB file.
false_positive_validation_data_path: "./train/data/validation_set_features.npy"
feature_data_files:
  "ACAV100M_sample": "./train/data/openwakeword_features_ACAV100M_2000_hrs_16bit.npy"

batch_n_per_class:
  "ACAV100M_sample": 1024
  "adversarial_negative": 50
  "positive": 50

# A small network on top of openWakeWord's frozen audio embedding —
# small enough to train on a laptop CPU.
model_type: "dnn"
layer_size: 32

# The main time dial. Measured at ~36 steps/sec on an M2 CPU, so this is
# about 23 minutes. This is openWakeWord's own full-quality default.
steps: 50000

# Raise max_negative_weight if the finished model wakes up too easily.
max_negative_weight: 1500
target_false_positives_per_hour: 0.2
